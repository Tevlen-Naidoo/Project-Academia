<!doctype html>
<html lang="en" data-repo="{{ repo }}" data-root="{{ root }}" data-push-key="{{ push_key }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{% block title %}Project Academia{% endblock %}</title>
<link rel="stylesheet" href="{{ root }}static/style.css">
<link rel="manifest" href="{{ root }}manifest.webmanifest">
<link rel="icon" href="{{ root }}static/icon-192.png">
<link rel="apple-touch-icon" href="{{ root }}static/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Academia">
<script type="module" src="{{ root }}static/js/app.js"></script>
</head>
<body>
<site-header current="{{ nav }}"></site-header>
<main>
<noscript><p class="message error">This site needs JavaScript to show its pages.</p></noscript>
<site-message></site-message>
{% block main %}{% endblock %}
</main>
<site-footer built="{{ built_at.strftime("%Y-%m-%d %H:%M") }}"></site-footer>
</body>
</html>
