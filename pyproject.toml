[project]
name = "project-academia"
version = "0.1.0"
description = "Daily academic paper recommender: fetches, scores and publishes three papers a day."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jinja2>=3.1",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "tenacity>=8.5",
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "respx>=0.21",
    "ruff>=0.6",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fetcher", "reader", "scorer", "site_builder"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["fetcher", "reader", "scorer", "site_builder", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
