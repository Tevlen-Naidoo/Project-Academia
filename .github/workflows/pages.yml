name: Publish site

# Builds the site from data/ and publishes it to GitHub Pages. Runs on every
# push to main. The board and devices live in Firestore, so using the site never
# pushes anything.
# One-time setup: Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --no-dev
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the web components
        run: npm run build
      - name: Build
        env:
          # Only the public half reaches the site; it turns on the Notifications setting.
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          # The Firebase web config (public by design) turns on sign-in and the live board.
          FIREBASE_CONFIG: ${{ vars.FIREBASE_CONFIG || secrets.FIREBASE_CONFIG }}
        run: uv run python -m site_builder build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
