name: Send notifications

# Pushes a notification to every device that turned them on in the site's
# Settings page. The daily run calls this once the site is published.
# Run it by hand (Actions -> Send notifications -> Run workflow) to send a test.
# One-time setup: add the VAPID_PRIVATE_KEY secret (see the README).

on:
  workflow_call:
    inputs:
      date:
        type: string
        required: true
      test:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test message instead of today's papers"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --no-dev
      - name: Send
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          # Devices are read from Firestore, and ones that turned notifications off are removed there.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DAY: ${{ inputs.date }}
          TEST: ${{ inputs.test }}
        run: |
          if [ "$TEST" = "true" ]; then
            uv run python -m notifier send --test
          elif [ -n "$DAY" ]; then
            uv run python -m notifier send --date "$DAY"
          else
            uv run python -m notifier send
          fi
