name: Daily papers

# Every morning: fetch candidates, pick 3 papers, find what to read first,
# commit the picks and prerequisites, and republish the site.
# GitHub's own schedule is unreliable: on 2026-11-06 and 2026-11-07 none of the
# scheduled runs started (a known GitHub problem). So an outside caller also
# starts the run each morning through workflow_dispatch with if_needed=true.
# Whichever starts first (the outside call or one of the three cron times,
# 05:17, 05:47 and 06:17 SAST) makes the day's papers; the others see today's
# picks file and stop at once.
# Run it by hand (Actions -> Daily papers -> Run workflow) to fill in a missed day;
# a run by hand always runs unless "only if needed" is ticked.

on:
  schedule:
    - cron: "17 3 * * *"
    - cron: "47 3 * * *"
    - cron: "17 4 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Day to pick for (YYYY-MM-DD). Leave empty for today."
        required: false
        default: ""
      if_needed:
        description: "Only if today's papers aren't up yet (for automated callers)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: daily-papers
  cancel-in-progress: false

jobs:
  check:
    # A scheduled or if_needed run stops here if today's papers are already up.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      done: ${{ steps.check.outputs.done }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: data/picks
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          IF_NEEDED: ${{ inputs.if_needed }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          day="$(date -u +%F)"
          only_if_needed=false
          if [ "$EVENT" = "schedule" ]; then only_if_needed=true; fi
          if [ "$IF_NEEDED" = "true" ] && [ -z "$INPUT_DATE" ]; then only_if_needed=true; fi
          if [ "$only_if_needed" = "true" ] && [ -f "data/picks/$day.json" ]; then
            echo "Today's papers ($day) are already up."
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi
  papers:
    needs: check
    if: needs.check.outputs.done != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      date: ${{ steps.day.outputs.date }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --no-dev
      - name: Choose the day
        id: day
        env:
          INPUT_DATE: ${{ inputs.date }}
        run: |
          day="${INPUT_DATE:-$(date -u +%F)}"
          if ! [[ "$day" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Not a date: $day" >&2
            exit 1
          fi
          echo "date=$day" >> "$GITHUB_OUTPUT"
      - name: Fetch
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: uv run python -m fetcher run --date "${{ steps.day.outputs.date }}"
      - name: Score
        env:
          # Reads the reading board, to skip papers already on it.
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: uv run python -m scorer run --date "${{ steps.day.outputs.date }}"
      - name: Find prerequisites
        # A failure here leaves out that day's prerequisites; the picks still go up.
        continue-on-error: true
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: uv run python -m reader prereqs --date "${{ steps.day.outputs.date }}"
      - name: Commit
        env:
          DAY: ${{ steps.day.outputs.date }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add "data/picks/$DAY.json"
          if [ -f "data/prereqs/$DAY.json" ]; then git add "data/prereqs/$DAY.json"; fi
          if [ -f "data/graphs/$DAY.json" ]; then git add "data/graphs/$DAY.json"; fi
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
            exit 0
          fi
          git commit -m "Daily papers for $DAY"
          # Another workflow may have pushed during the run.
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            sleep $((attempt * 5))
            git pull --rebase
          done
          exit 1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: daily-${{ steps.day.outputs.date }}
          path: |
            data/candidates/*.json
            data/picks/*.json
            data/prereqs/*.json
            data/graphs/*.json
          retention-days: 30
          if-no-files-found: warn
  publish:
    needs: papers
    uses: ./.github/workflows/pages.yml
    secrets: inherit
    permissions:
      contents: read
      pages: write
      id-token: write
  notify:
    # After the site is live, so tapping the notification shows the new papers.
    needs: [papers, publish]
    uses: ./.github/workflows/notify.yml
    secrets: inherit
    with:
      date: ${{ needs.papers.outputs.date }}
    permissions:
      contents: read
