name: Fetch candidates (manual)

# Runs the fetcher and the scorer on demand and uploads the candidates and
# picks files as a workflow artifact. It does not commit anything, so every
# run scores without past picks. The daily schedule is in daily.yml.

on:
  workflow_dispatch:
    inputs:
      fresh_days:
        description: "Days of new arXiv submissions to fetch"
        default: "7"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --no-dev
      - name: Fetch
        env:
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: uv run python -m fetcher run --fresh-days "${{ inputs.fresh_days }}"
      - name: Score
        run: uv run python -m scorer run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidates
          path: |
            data/candidates/*.json
            data/picks/*.json
          if-no-files-found: warn
