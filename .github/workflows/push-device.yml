name: Add notification device

# Saves a phone, tablet or computer for the daily notification, from the code the
# site's Settings page shows after "Turn on notifications", then sends it a test.
# Run it from Actions -> Add notification device -> Run workflow (works in the GitHub app).

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Sign-up code from the site's Settings page (starts with pa1.)"
        required: true

permissions:
  contents: write

concurrency:
  group: notify
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked --no-dev
      - name: Save the device and send it a test
        env:
          CODE: ${{ inputs.code }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: uv run python -m notifier add-device "$CODE"
      - name: Commit
        if: success() || failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add data/push/subscriptions.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Notifications: add a device"
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            sleep $((attempt * 5))
            git pull --rebase
          done
          exit 1
